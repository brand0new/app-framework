[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "appygentic"
version = "2.0.0"
description = "ADK-native multi-agent platform for API proxy implementation on GCP Apigee X and Azure APIM"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # Google ADK
    "google-adk>=1.28.0",
    # A2A protocol
    "a2a-sdk>=1.0.0",
    # ASGI server for A2A gateway
    "uvicorn[standard]>=0.30.0",
    # HTTP client for BPMN service calls
    "httpx>=0.27.0",
    # Neo4j driver
    "neo4j>=5.20.0",
    # Kafka / Confluent
    "confluent-kafka>=2.4.0",
    # Stripe billing
    "stripe>=9.0.0",
    # OpenTelemetry
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    # Vertex AI
    "google-cloud-aiplatform>=1.60.0",
    "google-auth>=2.29.0",
    # MCP
    "mcp>=1.0.0",
    # Env / config
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["appygentic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
