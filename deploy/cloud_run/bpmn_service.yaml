apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: appygentic-bpmn-service
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu: "1"
        run.googleapis.com/memory: "512Mi"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/appygentic-bpmn-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
